---
- name: Check which boot config path exists
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: rpi_firmware_config

- name: Enable watchdog in boot config
  ansible.builtin.lineinfile:
    path: "{{ '/boot/firmware/config.txt' if rpi_firmware_config.stat.exists else '/boot/config.txt' }}"
    line: 'dtparam=watchdog=on'
    insertafter: EOF
  notify: Reboot Pi

- name: Ensure watchdog software is installed
  ansible.builtin.apt:
    name: watchdog
    state: present

- name: Configure watchdog settings
  ansible.builtin.template:
    src: "watchdog.conf.j2"
    dest: "/etc/watchdog.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart watchdog

- name: Start watchdog service
  ansible.builtin.service:
    name: watchdog
    state: started
    enabled: true
  notify: Check watchdog status
