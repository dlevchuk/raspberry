---
- name: Ensure Homepage configuration directory exists
  ansible.builtin.file:
    path: "{{ docker_dir }}/homepage"
    state: directory
    owner: "{{ docker_user | default('pi') }}"
    group: "{{ docker_user | default('pi') }}"
    mode: "0755"

- name: Deploy Homepage configuration files
  ansible.builtin.template:
    src: "homepage/{{ item }}.j2"
    dest: "{{ docker_dir }}/homepage/{{ item }}"
    owner: "{{ docker_user | default('pi') }}"
    group: "{{ docker_user | default('pi') }}"
    mode: "0644"
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - bookmarks.yaml
    - docker.yaml

- name: Setup Homepage container
  community.docker.docker_container:
    name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    recreate: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ docker_dir }}/homepage:/app/config"
    env:
      HOMEPAGE_ALLOWED_HOSTS: "raspberrypi.tail72e9f.ts.net:3005"
      PUID: "0"
      PGID: "0"
    ports:
      - "3005:3000"
    restart_policy: always
