---
- name: Setup Homebridge
  community.docker.docker_container:
    name: homebridge
    image: oznu/homebridge:latest
    volumes:
      - "{{ docker_dir }}/homebridge:/homebridge"
    network_mode: host
    log_driver: json-file
    log_options:
      max-size: "10mb"
      max-file: "1"
    env:
      UID: "{{ docker_uid }}"
      GID: "{{ docker_gid }}"
      TZ: "{{ timezone }}"
    restart_policy: always
